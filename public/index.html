<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipFlow AI - Free Video Clipper</title>
  
  <!-- 👉 Apna Google AdSense code yahan paste karein -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7443491237232128" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>🚀 ClipFlow AI</h1>
    <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">Turn Long Videos into Viral Shorts Instantly</p>
    
    <form id="clipForm">
      <div class="form-group">
        <label>YouTube Video URL</label>
        <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>
      <button type="submit" class="submit-btn">Generate Viral Clips</button>
    </form>

    <div id="progressContainer">
      <p id="progressMessage">Processing...</p>
      <div class="progress-bar-bg"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <div id="resultsContainer">
      <h2>Generated Clips</h2>
      <div id="clipsList"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
